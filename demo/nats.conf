# Demo NATS server: 8 MiB payloads (MCP tool results carry base64 blobs) and
# two users whose subject permissions ARE the MCP authorization plane.
port: 4222
max_payload: 8MB

authorization {
  users = [
    # The gateway's own identity: receives requests, replies to inboxes.
    {
      user: gateway
      password: gateway
      permissions: {
        subscribe: ["mcp.v1.req.>", "_INBOX.>", "$SRV.>"]
        publish:   ["_INBOX.>", "$SRV.>"]
      }
    }

    # admin may call anything on any server in tenant "demo".
    {
      user: admin
      password: admin
      permissions: {
        publish:   ["mcp.v1.req.demo.>", "_INBOX.>"]
        subscribe: ["_INBOX.>"]
      }
    }

    # reader may ONLY list tools and discover — tools/call is not granted.
    # Watch a tools/call fail with no gateway code running: that is the
    # entire authz story. The "_" after the tenant is the user token; this
    # demo is unattributed. Under per-user auth (NATS auth callout) you would
    # scope each user to mcp.v1.req.demo.{user}.> instead, which is also how
    # the gateway attributes requests to a user.
    {
      user: reader
      password: reader
      permissions: {
        publish: [
          "mcp.v1.req.demo._.everything.tools.list._",
          "mcp.v1.req.demo._.everything.server.discover._",
          "_INBOX.>"
        ]
        subscribe: ["_INBOX.>"]
      }
    }
  ]
}
