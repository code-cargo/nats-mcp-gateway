name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
      ref:
        description: "Source ref to build from - commit SHA, branch, or tag (defaults to the triggering commit)"
        required: false
        type: string

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: code-cargo/cargowall-action@a2472831320add39bf8560296a1b72f9126890bd # v1.3.4

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: CI_VERSION="${{ inputs.tag }}" GOOS=linux GOARCH="${{ matrix.arch }}" make build

      - name: Rename binary
        run: mv bin/natsmcp "bin/natsmcp-linux-${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: natsmcp-linux-${{ matrix.arch }}
          path: bin/natsmcp-linux-${{ matrix.arch }}

  release:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: code-cargo/cargowall-action@a2472831320add39bf8560296a1b72f9126890bd # v1.3.4

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: artifacts/natsmcp-linux-*

      - name: Stage bundle for release upload
        run: cp "${{ steps.attest.outputs.bundle-path }}" artifacts/attestations.sigstore.json

      - name: Create checksums
        working-directory: artifacts
        run: sha256sum natsmcp-linux-* > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET="${{ inputs.ref || github.sha }}"
          gh release create "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.tag }}" \
            --target "$TARGET" \
            --generate-notes \
            --prerelease \
            --draft

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" artifacts/* --repo "${{ github.repository }}"
